services:
  api:
    build: .
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://tickvendor:tickvendor@db/tickvendor
      SECRET_KEY: ${SECRET_KEY}
    depends_on: [db, redis]
    ports: ["8000:8000"]
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tickvendor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tickvendor
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
