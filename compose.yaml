services:
  api:
    build: .
    env_file: [.env]
    command: ["sh", "-c", "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"]
    depends_on: [db, redis]
    ports: ["8000:8000"]
  worker:
    build: .
    command: ["python", "scripts/notification_worker.py"]
    env_file: [.env]
    depends_on: [db, redis]
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tickvendor
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tickvendor
    volumes: ["postgres-data:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
volumes:
  postgres-data:
  redis-data:
